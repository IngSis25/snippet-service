spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  jpa:
    hibernate:
      ddl-auto: create-drop

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://dummy
          client-id: dummy-client-id
          client-secret: dummy-client-secret

  asset:
    service:
      url: http://localhost:8080/v1/asset
  authorization:
    service:
      url: http://localhost:8080/api

auth0:
  audience: dummy-audience

stream:
  runner:
    key: runnerStream
